[project]
name = "wfx"
version = "0.0.1"
description = "Explains retail labour-demand forecasts to workforce planners, with verified numbers."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "duckdb>=1.5.6",
    "google-genai>=2.28.0",
    "langgraph>=1.2.12",
    "numpy>=2.4.6",
    "pandas>=3.0.6",
    "pandera>=0.33.1",
    "pyarrow>=25.0.1",
    "pydantic>=2.13.5",
    "python-dotenv>=1.2.4",
    "scikit-learn>=1.9.1",
    "shap>=0.51.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/wfx"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
